name: registry

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run registry:build

      - run: node scripts/check-registry.mjs

      - run: node scripts/check-tokens-parity.mjs
